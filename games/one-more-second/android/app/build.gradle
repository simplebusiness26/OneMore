plugins {
    id 'com.android.application'
}

android {
    namespace 'com.onemore.second'
    compileSdk 35

    defaultConfig {
        applicationId 'com.onemore.second'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

tasks.register('syncWebAssets', Sync) {
    from('../../web')
    into('src/main/assets')
    exclude('manifest.webmanifest', 'sw.js')
}

preBuild.dependsOn syncWebAssets
