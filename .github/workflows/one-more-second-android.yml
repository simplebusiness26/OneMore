name: Build ONE MORE SECOND Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'games/one-more-second/**'
      - '.github/workflows/one-more-second-android.yml'

permissions:
  contents: write

concurrency:
  group: one-more-second-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Set up Node
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Java
        id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Tool versions
        id: versions
        run: |
          node --version
          npm --version
          java -version

      - name: Install game dependencies
        id: npm
        working-directory: games/one-more-second
        run: npm install --no-audit --no-fund

      - name: Validate and prepare web bundle
        id: web
        working-directory: games/one-more-second
        run: |
          node --check web/game.js
          rm -rf dist android
          mkdir -p dist
          cp web/index.html web/styles.css web/game.js web/manifest.webmanifest web/sw.js dist/
          test -f dist/index.html
          test -f dist/styles.css
          test -f dist/game.js
          test -f dist/manifest.webmanifest
          test -f dist/sw.js

      - name: Create Android project
        id: capadd
        working-directory: games/one-more-second
        run: npx cap add android

      - name: Sync web assets
        id: capsync
        working-directory: games/one-more-second
        run: npx cap sync android

      - name: Install stable debug signing key
        id: signing
        run: |
          set -euxo pipefail
          cat .github/one-more-debug.keystore.b64 .github/one-more-debug.keystore.b64.part2 > /tmp/one-more-debug.keystore.b64
          mkdir -p "$HOME/.android"
          base64 --decode /tmp/one-more-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -storetype PKCS12 -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Build debug APK
        id: gradle
        working-directory: games/one-more-second/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        id: verify
        run: |
          test -f games/one-more-second/android/app/build/outputs/apk/debug/app-debug.apk
          cp games/one-more-second/android/app/build/outputs/apk/debug/app-debug.apk one-more-second-debug.apk
          ls -lh one-more-second-debug.apk

      - name: Upload workflow artifact
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: one-more-second-debug-apk
          path: one-more-second-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view one-more-second-latest >/dev/null 2>&1; then
            gh release upload one-more-second-latest one-more-second-debug.apk --clobber
          else
            gh release create one-more-second-latest one-more-second-debug.apk \
              --title 'ONE MORE SECOND Android APK' \
              --notes 'Latest installable debug APK for ONE MORE SECOND.'
          fi

      - name: Record ONE MORE SECOND build diagnostics
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          NODE: ${{ steps.node.outcome }}
          JAVA: ${{ steps.java.outcome }}
          VERSIONS: ${{ steps.versions.outcome }}
          NPM: ${{ steps.npm.outcome }}
          WEB: ${{ steps.web.outcome }}
          CAPADD: ${{ steps.capadd.outcome }}
          CAPSYNC: ${{ steps.capsync.outcome }}
          SIGNING: ${{ steps.signing.outcome }}
          GRADLE: ${{ steps.gradle.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
          RELEASE: ${{ steps.release.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cat > /tmp/one-more-second-build-status.txt <<EOF
          status=$JOB_STATUS
          commit=$COMMIT_SHA
          run_id=$RUN_ID
          checkout=$CHECKOUT
          setup_node=$NODE
          setup_java=$JAVA
          tool_versions=$VERSIONS
          npm_install=$NPM
          prepare_web=$WEB
          capacitor_add_android=$CAPADD
          capacitor_sync=$CAPSYNC
          stable_debug_signing=$SIGNING
          gradle_build=$GRADLE
          verify_apk=$VERIFY
          upload_artifact=$ARTIFACT
          publish_release=$RELEASE
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard
          git clean -fdx
          git fetch origin main
          git checkout -B ci-status origin/main
          mkdir -p games/one-more-second
          cp /tmp/one-more-second-build-status.txt games/one-more-second/build-status.txt
          git add games/one-more-second/build-status.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record ONE MORE SECOND build status [skip ci]"
          git push origin HEAD:main
