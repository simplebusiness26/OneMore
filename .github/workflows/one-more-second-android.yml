name: Build ONE MORE SECOND Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'games/one-more-second/**'
      - '.github/workflows/one-more-second-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android API 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Validate web game
        run: |
          node --check games/one-more-second/web/game.js
          test -f games/one-more-second/web/index.html
          test -f games/one-more-second/web/styles.css
          test -f games/one-more-second/web/manifest.webmanifest

      - name: Build debug APK
        run: gradle -p games/one-more-second/android :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and synced game assets
        run: |
          test -f games/one-more-second/android/app/src/main/assets/index.html
          test -f games/one-more-second/android/app/src/main/assets/game.js
          test -f games/one-more-second/android/app/build/outputs/apk/debug/app-debug.apk
          cp games/one-more-second/android/app/build/outputs/apk/debug/app-debug.apk one-more-second-debug.apk
          ls -lh one-more-second-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: one-more-second-debug-apk
          path: one-more-second-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view one-more-second-latest >/dev/null 2>&1; then
            gh release upload one-more-second-latest one-more-second-debug.apk --clobber
          else
            gh release create one-more-second-latest one-more-second-debug.apk \
              --title 'ONE MORE SECOND Android APK' \
              --notes 'Latest installable debug APK for ONE MORE SECOND.'
          fi
