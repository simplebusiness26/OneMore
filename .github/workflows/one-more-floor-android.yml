name: Build One More Floor APK

on:
  workflow_dispatch:
  push:
    branches: [main, one-more-floor-staging]
    paths:
      - 'games/one-more-floor/**'
      - '.github/workflows/one-more-floor-android.yml'
      - '.github/one-more-floor-debug.keystore.b64'

permissions:
  contents: write

defaults:
  run:
    working-directory: games/one-more-floor

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Set up Node
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Java
        id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        id: npm
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        id: jscheck
        run: node --check game.js

      - name: Prepare web bundle
        id: web
        run: |
          rm -rf dist android
          mkdir -p dist/icons
          cp index.html styles.css game.js manifest.webmanifest sw.js dist/
          cp icons/icon.svg dist/icons/
          test -s dist/index.html
          test -s dist/game.js

      - name: Create Android project
        id: capadd
        run: npx cap add android

      - name: Sync web assets
        id: capsync
        run: npx cap sync android

      - name: Install stable debug signing key
        id: signing
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode "${{ github.workspace }}/.github/one-more-floor-debug.keystore.b64" > "$HOME/.android/debug.keystore"
          echo "33c130fbab855317613c1c24a447064619102be50c448b4092a6b4e5c997baf4  $HOME/.android/debug.keystore" | sha256sum -c -
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        id: gradle
        working-directory: games/one-more-floor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        id: verify
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk one-more-floor-debug.apk
          ls -lh one-more-floor-debug.apk

      - name: Upload workflow artifact
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: one-more-floor-debug-apk
          path: games/one-more-floor/one-more-floor-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view one-more-floor-android-latest >/dev/null 2>&1; then
            gh release upload one-more-floor-android-latest one-more-floor-debug.apk --clobber
          else
            gh release create one-more-floor-android-latest one-more-floor-debug.apk \
              --title "ONE MORE FLOOR Android APK" \
              --notes "Latest installable debug APK for ONE MORE FLOOR."
          fi

      - name: Record build diagnostics
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          NODE: ${{ steps.node.outcome }}
          JAVA: ${{ steps.java.outcome }}
          NPM: ${{ steps.npm.outcome }}
          JSCHECK: ${{ steps.jscheck.outcome }}
          WEB: ${{ steps.web.outcome }}
          CAPADD: ${{ steps.capadd.outcome }}
          CAPSYNC: ${{ steps.capsync.outcome }}
          SIGNING: ${{ steps.signing.outcome }}
          GRADLE: ${{ steps.gradle.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
          RELEASE: ${{ steps.release.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cat > build-status.txt <<STATUS
          status=$JOB_STATUS
          commit=$COMMIT_SHA
          run_id=$RUN_ID
          checkout=$CHECKOUT
          setup_node=$NODE
          setup_java=$JAVA
          npm_install=$NPM
          js_syntax_check=$JSCHECK
          prepare_web=$WEB
          capacitor_add_android=$CAPADD
          capacitor_sync=$CAPSYNC
          stable_debug_signing=$SIGNING
          gradle_build=$GRADLE
          verify_apk=$VERIFY
          upload_artifact=$ARTIFACT
          publish_release=$RELEASE
          STATUS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record One More Floor Android build status [skip ci]"
          git push
