name: Build One More Door APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'games/one-more-door/**'
      - '.github/workflows/one-more-door-android.yml'
      - '.github/one-more-door-debug.keystore.b64'

permissions:
  contents: write

concurrency:
  group: one-more-door-android-main
  cancel-in-progress: true

defaults:
  run:
    working-directory: games/one-more-door

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Mark build running
        id: running
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cat > build-status.txt <<STATUS
          status=running
          commit=$COMMIT_SHA
          run_id=$RUN_ID
          STATUS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status.txt
          git commit -m "Mark One More Door Android build running [skip ci]"
          git push

      - name: Set up Node
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Java
        id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        id: npm
        run: npm install --no-audit --no-fund

      - name: Validate game JavaScript
        id: jscheck
        run: npm run check

      - name: Build offline web bundle
        id: web
        run: npm run build:web

      - name: Create Android shell
        id: capadd
        run: npx cap add android

      - name: Sync game into Android
        id: capsync
        run: npx cap sync android

      - name: Install stable debug signing key
        id: signing
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode "${{ github.workspace }}/.github/one-more-door-debug.keystore.b64" > "$HOME/.android/debug.keystore"
          echo "$(cat "${{ github.workspace }}/games/one-more-door/.github/one-more-door-debug.keystore.sha256")  $HOME/.android/debug.keystore" | sha256sum -c -
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        id: gradle
        working-directory: games/one-more-door/android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt of 3"
            if ./gradlew assembleDebug --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Verify and stage APK
        id: verify
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk one-more-door-debug.apk
          ls -lh one-more-door-debug.apk

      - name: Upload APK artifact
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: one-more-door-debug-apk
          path: games/one-more-door/one-more-door-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest downloadable APK release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view one-more-door-android-latest >/dev/null 2>&1; then
            gh release upload one-more-door-android-latest one-more-door-debug.apk --clobber
          else
            gh release create one-more-door-android-latest one-more-door-debug.apk \
              --title "ONE MORE DOOR Android APK" \
              --notes "Latest installable ONE MORE DOOR Android debug APK. Built automatically from main."
          fi

      - name: Record build diagnostics
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          RUNNING: ${{ steps.running.outcome }}
          NODE: ${{ steps.node.outcome }}
          JAVA: ${{ steps.java.outcome }}
          NPM: ${{ steps.npm.outcome }}
          JSCHECK: ${{ steps.jscheck.outcome }}
          WEB: ${{ steps.web.outcome }}
          CAPADD: ${{ steps.capadd.outcome }}
          CAPSYNC: ${{ steps.capsync.outcome }}
          SIGNING: ${{ steps.signing.outcome }}
          GRADLE: ${{ steps.gradle.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
          RELEASE: ${{ steps.release.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cat > build-status.txt <<STATUS
          status=$JOB_STATUS
          commit=$COMMIT_SHA
          run_id=$RUN_ID
          checkout=$CHECKOUT
          mark_running=$RUNNING
          setup_node=$NODE
          setup_java=$JAVA
          npm_install=$NPM
          js_syntax_check=$JSCHECK
          prepare_web=$WEB
          capacitor_add_android=$CAPADD
          capacitor_sync=$CAPSYNC
          stable_debug_signing=$SIGNING
          gradle_build=$GRADLE
          verify_apk=$VERIFY
          upload_artifact=$ARTIFACT
          publish_release=$RELEASE
          STATUS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record One More Door Android build status [skip ci]"
          git push
